name: Native app builds and launch tests
on:
  push:
    branches: [main]
    paths-ignore:
      - 'floot-export/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
  android-package:
    needs: verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Verify Android SDK packages
        run: |
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codera-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  android-launch-test:
    needs: android-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: codera-android-apk, path: artifacts }
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb install artifacts/app-debug.apk
            adb shell monkey -p ai.codera.app 1
            sleep 15
            adb shell uiautomator dump /sdcard/codera-window.xml
            adb pull /sdcard/codera-window.xml codera-window.xml
            adb shell pidof ai.codera.app
            adb shell dumpsys activity activities | grep ai.codera.app
            test -s codera-window.xml
            adb shell screencap -p /sdcard/codera-android.png
            adb pull /sdcard/codera-android.png codera-android.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codera-android-launch-evidence
          path: |
            codera-window.xml
            codera-android.png
          if-no-files-found: ignore
          retention-days: 7
  windows-package-test:
    needs: verify-web
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Package portable EXE and installer
        run: npx electron-builder --win portable --x64
      - name: Launch and inspect the packaged EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $exe = (Get-ChildItem release -Filter '*portable.exe' | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Portable Codera EXE was not created.' }
          $env:CODERA_E2E = '1'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            node tests/desktop-smoke.mjs
            Start-Sleep -Seconds 2
            if ($process.HasExited) { throw 'Codera closed unexpectedly after launch.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: codera-windows-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codera-windows-launch-evidence
          path: test-results/codera-desktop.png
          if-no-files-found: ignore
          retention-days: 7
