name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect application and package manager
        id: project
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "No root package.json yet. Source migration is still pending; verification is safely skipped."
            exit 0
          fi

          echo "has_package=true" >> "$GITHUB_OUTPUT"

          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found (pnpm-lock.yaml, yarn.lock, package-lock.json)." >&2
            exit 1
          fi

      - name: Enable Corepack
        if: steps.project.outputs.has_package == 'true' && (steps.project.outputs.manager == 'pnpm' || steps.project.outputs.manager == 'yarn')
        run: corepack enable

      - name: Install dependencies
        if: steps.project.outputs.has_package == 'true'
        shell: bash
        run: |
          case "${{ steps.project.outputs.manager }}" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              if node -e "process.exit(require('./package.json').packageManager?.startsWith('yarn@1.') ? 0 : 1)"; then
                yarn install --frozen-lockfile
              else
                yarn install --immutable
              fi
              ;;
          esac

      - name: Run lint
        if: steps.project.outputs.has_package == 'true'
        run: npm run lint --if-present

      - name: Run type check
        if: steps.project.outputs.has_package == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          elif node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            npm run check
          else
            echo "No typecheck or check script declared; skipping."
          fi

      - name: Run tests
        if: steps.project.outputs.has_package == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.project.outputs.has_package == 'true'
        run: npm run build --if-present
